name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  linux:
    name: Linux · swift 6.0 · warnings as errors
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Clean build (library + tests) with warnings as errors
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
  macos:
    name: macOS · tests + generic iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Test (warnings as errors)
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build both library products for a generic iOS Simulator
        run: |
          xcodebuild build -scheme StreamGateway-Package \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
  mutation:
    name: Mutation check (each mutant must fail a test)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Run mutants
        run: bash scripts/mutation-check.sh
